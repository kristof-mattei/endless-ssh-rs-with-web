allowBuilds:
  maplibre-gl: false
catalogs:
  default:
    vite: "8.3.6"
overrides:
  "@codecov/vite-plugin>vite": "catalog:default"
packageExtensions:
  # dependency-cruiser parses with the TypeScript JS API, which TypeScript 7 does not ship
  dependency-cruiser:
    dependencies:
      typescript: "npm:@typescript/typescript6@6.0.2"
