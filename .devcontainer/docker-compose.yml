services:
  devcontainer:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ../:/workspace/vscode/
      # separate node_modules per environment, because sharing one across host and
      # container yields ERR_PNPM_UNEXPECTED_STORE on every switch
      - node-modules:/workspace/vscode/node_modules
    depends_on:
      - timescaledb
    network_mode: service:timescaledb
    command: sleep infinity

  timescaledb:
    image: timescale/timescaledb:2.29.2-pg18@sha256:9508616d5b941ed931198504c5db3fb47e8f53f790732ea1e889591f1062057c
    restart: unless-stopped
    ports:
      - 127.0.0.1:5432:5432
    env_file:
      - ../.env
    volumes:
      - timescaledb-data:/var/lib/postgresql/
      - ../init-db/:/docker-entrypoint-initdb.d/

volumes:
  node-modules:
  timescaledb-data:
