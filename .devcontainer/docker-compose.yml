services:
  devcontainer:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ../:/workspace/vscode/
      # separate node_modules per environment, because sharing one across host and
      # container yields ERR_PNPM_UNEXPECTED_STORE on every switch
      - node-modules:/workspace/vscode/node_modules
    depends_on:
      - timescaledb
    network_mode: service:timescaledb
    command: sleep infinity

  timescaledb:
    image: timescale/timescaledb:2.30.2-pg18@sha256:e72689191e1c977892c53d6f2c344dbc4a9657a867dc8cc1899229f9d3672b2e
    restart: unless-stopped
    ports:
      - 127.0.0.1:5432:5432
    env_file:
      - ../.env
    volumes:
      - timescaledb-data:/var/lib/postgresql/
      - ../init-db/:/docker-entrypoint-initdb.d/

volumes:
  node-modules:
  timescaledb-data:
