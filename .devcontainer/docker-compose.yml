services:
  devcontainer:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ../:/workspace/vscode/
      # separate node_modules per environment, because sharing one across host and container yields ERR_PNPM_UNEXPECTED_STORE on every switch
      - node-modules:/workspace/vscode/node_modules
    depends_on:
      - timescaledb
    network_mode: service:timescaledb
    command: sleep infinity

  timescaledb:
    image: timescale/timescaledb:2.32.0-pg18@sha256:83952d54cfc74d9aebe4aba6ecf2af829c2bcf1f30058dded4c18ab3720a247a
    restart: unless-stopped
    ports:
      - 127.0.0.1:5432:5432
    env_file:
      - ../.env
    volumes:
      - timescaledb-data:/var/lib/postgresql/
      - ../init-db/:/docker-entrypoint-initdb.d/

volumes:
  node-modules:
  timescaledb-data:
